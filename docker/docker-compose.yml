# NPanel Docker 编排方案
# 与 podman/ 方案等价: PHP 7.4 FPM + Redis, 供宿主机 Nginx 反代使用
#
# 启动:   docker compose up -d
# 构建:   docker compose build --no-cache
# 查看日志: docker compose logs -f php7
#
# 注意: MySQL(5.7) 与 Adminer 按需启用, 默认注释, 见文件底部

services:
  # PHP 7.4 FPM — NPanel 运行容器 (对应 podman 方案的 php7-npanel)
  php7:
    build:
      context: ./php7
      dockerfile: Dockerfile
    image: npanel/php7:latest
    container_name: php7-npanel
    # 对应 podman 方案: --network main (所有互相访问的服务需加入同一网络)
    networks:
      - main
    # 仅监听本地回环, 由宿主机 Nginx fastcgi_pass 127.0.0.1:9001 接入
    ports:
      - "127.0.0.1:9001:9000"
    volumes:
      # 宿主机与容器路径保持一致 (/var/www -> /var/www),
      # 这样 Nginx 的 SCRIPT_FILENAME 与容器内路径天然对齐
      # SELinux 主机可追加 :Z (Docker 同样支持该挂载选项)
      - /var/www:/var/www
    working_dir: /var/www
    restart: always

  # Redis — 缓存/队列 (对应 podman 方案的 redis 容器)
  redis:
    image: redis:alpine
    container_name: redis
    networks:
      - main
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - /opt/redis/data:/data
    # 对应 podman 方案: --sysctl net.core.somaxconn=1024
    sysctls:
      net.core.somaxconn: 1024
    command: redis-server --appendonly yes
    restart: always

  # ──────── 以下为可选服务, 按需取消注释 ────────

  # MySQL 5.7 — 与宿主机现有 mysql 容器等价
  # mysql:
  #   image: mysql:5.7
  #   container_name: mysql
  #   networks:
  #     - main
  #   ports:
  #     - "127.0.0.1:3306:3306"
  #   volumes:
  #     - /opt/mysql/data:/var/lib/mysql
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
  #   command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
  #   restart: always

  # Adminer — 数据库管理界面
  # adminer:
  #   image: adminer:latest
  #   container_name: adminer
  #   networks:
  #     - main
  #   ports:
  #     - "127.0.0.1:8081:8080"
  #   restart: always

# 对应 podman 方案: podman network create main
networks:
  main:
    name: main
