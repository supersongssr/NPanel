server {
    listen 80;
    listen [::]:80; #无 IPv6，此项可删除。

    # 泛域名匹配: 匹配 *.nodeDomain
    server_name .__nodeDomainRegex__;

    # 301 永久重定向到 https
    return 301 https://$host$request_uri;
}

server {
    listen __nginxPort__ ssl;
    listen [::]:__nginxPort__ ssl;
    http2 on;

    # 泛域名匹配: 匹配 *.nodeDomain
    server_name .__nodeDomainRegex__;

    # SSL 证书 (泛域名证书)
    ssl_certificate     /etc/ssl/__nodeDomain__.pem;
    ssl_certificate_key /etc/ssl/__nodeDomain__.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # XHTTP 分流 - 无 IP 限制, 用户直连
    location /__xhttpPath__ {
        proxy_redirect off;
        proxy_pass http://127.0.0.1:__xhttpPort__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket 分流 - 仅允许 Cloudflare IP
    location /__wsPath__ {
        # Cloudflare IP 白名单
        allow 173.245.48.0/20;
        allow 103.21.244.0/22;
        allow 103.22.200.0/22;
        allow 103.31.4.0/22;
        allow 141.101.64.0/18;
        allow 108.162.192.0/18;
        allow 190.93.240.0/20;
        allow 188.114.96.0/20;
        allow 197.234.240.0/22;
        allow 198.41.128.0/17;
        allow 162.158.0.0/15;
        allow 104.16.0.0/13;
        allow 104.24.0.0/14;
        allow 172.64.0.0/13;
        allow 131.0.72.0/22;
        allow 2400:cb00::/32;
        allow 2606:4700::/32;
        allow 2803:f800::/32;
        allow 2405:b500::/32;
        allow 2405:8100::/32;
        allow 2a06:98c0::/29;
        allow 2c0f:f248::/32;
        deny all;

        proxy_redirect off;
        proxy_pass http://127.0.0.1:__wsPort__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # gRPC 分流 - 仅允许 Cloudflare IP
    location /__v2ServiceName__ {
        # Cloudflare IP 白名单
        allow 173.245.48.0/20;
        allow 103.21.244.0/22;
        allow 103.22.200.0/22;
        allow 103.31.4.0/22;
        allow 141.101.64.0/18;
        allow 108.162.192.0/18;
        allow 190.93.240.0/20;
        allow 188.114.96.0/20;
        allow 197.234.240.0/22;
        allow 198.41.128.0/17;
        allow 162.158.0.0/15;
        allow 104.16.0.0/13;
        allow 104.24.0.0/14;
        allow 172.64.0.0/13;
        allow 131.0.72.0/22;
        allow 2400:cb00::/32;
        allow 2606:4700::/32;
        allow 2803:f800::/32;
        allow 2405:b500::/32;
        allow 2405:8100::/32;
        allow 2a06:98c0::/29;
        allow 2c0f:f248::/32;
        deny all;

        grpc_pass grpc://127.0.0.1:__grpcPort__;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 默认回落: 伪装站
    location / {
        proxy_redirect off;
        proxy_pass http://__httpProxyHost__;
        proxy_set_header Host __httpProxyHost__;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
    }
}
