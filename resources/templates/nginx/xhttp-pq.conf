server {
    listen 80;
    listen [::]:80; #无 IPv6，此项可删除。

    # 泛域名匹配: 匹配 *.nodeDomain
    server_name .__nodeDomainRegex__;

    # 301 永久重定向到 https
    return 301 https://$host$request_uri;
}

server {
    listen __nginxPort__ ssl;
    listen [::]:__nginxPort__ ssl;
    http2 on;

    # 泛域名匹配: 匹配 *.nodeDomain
    server_name .__nodeDomainRegex__;

    # SSL 证书 (泛域名证书)
    ssl_certificate     /etc/ssl/__nodeDomain__.pem;
    ssl_certificate_key /etc/ssl/__nodeDomain__.key;

    # —— xhttp-pq: 后量子混合密钥交换 (X25519MLKEM768) ——
    # X25519MLKEM768 = X25519 + ML-KEM-768 混合后量子组, 仅 TLS 1.3 定义.
    # 锁定 TLS 1.3 (该组为 1.3 专用; TLS 1.2 无此曲线, 放行亦无法握手).
    ssl_protocols       TLSv1.3;
    # 仅允许 PQ 混合曲线: 服务端只接受 X25519MLKEM768 这一个 key share.
    # GFW 旧栈 (Go<1.23 / OpenSSL<3.5) 不支持该组, 主动探测握手即失败 (alert 40),
    # 无法坐实节点为代理 -> 密码学硬门槛防封 (非指纹伪装).
    # 前置: nginx 链接的 OpenSSL >= 3.5 (register 阶段校验 node_openssl; 不满足则降级).
    ssl_ecdh_curve      X25519MLKEM768;
    # 注: 删除 ssl_ciphers (TLS1.2 专用, 1.3-only 配置下无意义).
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # XHTTP 分流 - 无 IP 限制, 用户直连
    location /__xhttpPath__ {
        proxy_redirect off;
        proxy_pass http://127.0.0.1:__xhttpPort__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 默认回落: 本地 AriaNg 静态站 (纯静态, 所有 conf 共用 /var/www/ariang)
    location / {
        root /var/www/ariang;
        index index.html;
    }
}
