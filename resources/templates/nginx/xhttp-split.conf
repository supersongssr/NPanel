# ============================================================================
# xhttp-split: VLESS + xhttp 上下行分离 (downloadSettings).
#
# 服务端配置与 xhttp.conf 完全一致 — split 是纯客户端概念:
#   - 上行 (upload):   客户端走 host/sni 域名 (普通 xhttp)
#   - 下行 (download): 客户端 downloadSettings 用 [独立域名 + 真实 IP] 拉取下行流
# 两条流命中同一路径 /{xhttpPath}, 经同一 nginx location 反代到同一 xray inbound,
# 故服务端无需任何 split 专属配置 (mode=auto 自动处理 packet-up / stream-up / 下载流).
#
# 上下行两域名分配 (同一 rootDomain, 复用一张泛域名证书 *.rootDomain):
#   - 上行域名 (host/sni):    {rand8}n{id}.{rootDomain}  /  {rand8}ipv6n{id}.{rootDomain}
#   - 下行域名 (dl_host):     {rand8}d{id}.{rootDomain}    (独立随机前缀 + 'd' 标记)
#   'd' vs 'n'/'ipv6n' 结构性保证两域永不相等 (不依赖随机防碰撞).
#   同一 server_name .{rootDomain} (泛域名) 同时服务上下行.
#
# 下行域名 (dl_host) 无需 DNS — 下行直连真实 IP (downloadSettings.address),
# dl_host 仅作 TLS SNI / HTTP Host, 复用 *.rootDomain 泛域名证书.
# ============================================================================

server {
    listen 80;
    listen [::]:80; #无 IPv6，此项可删除。

    # 泛域名匹配: 匹配 *.nodeDomain
    server_name .__nodeDomainRegex__;

    # 301 永久重定向到 https
    return 301 https://$host$request_uri;
}

server {
    listen __nginxPort__ ssl;
    listen [::]:__nginxPort__ ssl;
    http2 on;

    # 泛域名匹配: 匹配 *.nodeDomain (上下行共用同一泛域名证书 + server_name)
    server_name .__nodeDomainRegex__;

    # SSL 证书 (泛域名证书)
    ssl_certificate     /etc/ssl/__nodeDomain__.pem;
    ssl_certificate_key /etc/ssl/__nodeDomain__.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # XHTTP 分流 - 无 IP 限制, 用户直连
    # 上下行两条流命中同一路径, 反代到同一 xray inbound (mode=auto 自动分发)
    location /__xhttpPath__ {
        proxy_redirect off;
        proxy_pass http://127.0.0.1:__xhttpPort__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 默认回落: 本地 AriaNg 静态站 (纯静态, 所有 conf 共用 /var/www/ariang)
    location / {
        root /var/www/ariang;
        index index.html;
    }
}
