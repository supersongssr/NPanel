# vision-reality-pq: vision-reality (reality 偷本地 nginx 8443) 的后量子变体.
# 差异仅在 8443 回落块: ssl_protocols 锁 TLSv1.3 + ssl_ecdh_curve 锁 X25519MLKEM768.
#
# 实验目的: 验证 reality 偷本地时, 若被偷的 nginx 8443 只允许 X25519MLKEM768 后量子
# 加密曲线, reality 的 TLS 握手 (xray Go TLS 作为 client 连 dest=127.0.0.1:8443) 会怎样.
# X25519MLKEM768 = X25519 + ML-KEM-768 混合后量子组, 仅 TLS 1.3 定义; nginx 8443 仅接受
# 该 key share, Go TLS < 1.23 / OpenSSL < 3.5 不支持, 握手即失败 (alert 40).
# -> 若 xray 内置 Go TLS 不支持该组, reality dest 握手失败, 节点无法工作 (实验结论).
# 前置: 节点 OpenSSL >= 3.5 (register 据 node_openssl 校验; 不满足则降级到默认 v2_name).
server {
    listen 80;
    listen [::]:80; #无 IPv6，此项可删除。

    # 泛域名匹配: 匹配 *.nodeDomain
    server_name .__nodeDomainRegex__;

    # 301 永久重定向到 https (标准 443 端口; 走 xray reality 透明回落到 nginx 8443)
    return 301 https://$host$request_uri;
}

server {
    # 8443: reality 偷自己的 dest + 非法探测/普通浏览器回落目标.
    # xray (443) realitySettings.dest=127.0.0.1:8443 把 TLS 握手与未认证流量都转到这里,
    # nginx 用泛域名证书应答, 让 reality 校验通过 + 对外像一个真实站点.
    listen 8443 ssl;
    listen [::]:8443 ssl; #无 IPv6，此项可删除。
    http2 on;

    # 泛域名匹配: 匹配 *.nodeDomain (reality SNI / serverNames = s{id}.nodeDomain)
    server_name .__nodeDomainRegex__;

    # SSL 证书 (泛域名证书, reality 偷此证书完成 TLS 握手)
    ssl_certificate     /etc/ssl/__nodeDomain__.pem;
    ssl_certificate_key /etc/ssl/__nodeDomain__.key;

    # —— vision-reality-pq: 后量子混合密钥交换 (X25519MLKEM768) ——
    # X25519MLKEM768 = X25519 + ML-KEM-768 混合后量子组, 仅 TLS 1.3 定义.
    # 锁定 TLS 1.3 (该组为 1.3 专用; TLS 1.2 无此曲线, 放行亦无法握手).
    ssl_protocols       TLSv1.3;
    # 仅允许 PQ 混合曲线: 服务端只接受 X25519MLKEM768 这一个 key share.
    # reality 偷本地时, xray Go TLS 作为 client 连 8443 必须支持该组才能完成握手;
    # Go TLS < 1.23 / OpenSSL < 3.5 不支持 -> 握手失败 (alert 40) -> 实验观测点.
    # 前置: nginx 链接的 OpenSSL >= 3.5 (register 阶段校验 node_openssl; 不满足则降级).
    ssl_ecdh_curve      X25519MLKEM768;
    # 注: 删除 ssl_ciphers (TLS1.2 专用, 1.3-only 配置下无意义).
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 默认回落 / 伪装站: 本地 AriaNg 静态站 (纯静态, 所有 conf 共用 /var/www/ariang)
    location / {
        root /var/www/ariang;
        index index.html;
    }
}
