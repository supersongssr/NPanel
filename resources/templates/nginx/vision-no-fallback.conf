server {
    listen 80;
    listen [::]:80; #无 IPv6，此项可删除。

    # 泛域名匹配: 匹配 *.nodeDomain
    server_name .__nodeDomainRegex__;

    # 301 永久重定向到 https
    return 301 https://$host$request_uri;
}

# vision-no-fallback: xray VLESS inbound 无 fallbacks 字段,
# 非法 TLS 探测 / 非代理流量在 xray 层直接失败 (不回落到 nginx).
# 故 nginx 仅保留 80→443 重定向; 无 8088 回落 server (已移除).
