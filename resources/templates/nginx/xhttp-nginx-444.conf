server {
    listen 80;
    listen [::]:80; #无 IPv6，此项可删除。

    # 泛域名匹配: 匹配 *.nodeDomain
    server_name .__nodeDomainRegex__;

    # 301 永久重定向到 https
    return 301 https://$host$request_uri;
}

server {
    listen __nginxPort__ ssl;
    listen [::]:__nginxPort__ ssl;
    http2 on;

    # 泛域名匹配: 匹配 *.nodeDomain
    server_name .__nodeDomainRegex__;

    # SSL 证书 (泛域名证书)
    ssl_certificate     /etc/ssl/__nodeDomain__.pem;
    ssl_certificate_key /etc/ssl/__nodeDomain__.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # XHTTP 分流 - 无 IP 限制, 用户直连
    location /__xhttpPath__ {
        proxy_redirect off;
        proxy_pass http://127.0.0.1:__xhttpPort__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # nginx-444: 路径不对直接 return 444 (nginx 关闭连接且不返回任何响应, 切断 TCP).
    # 仅正确 xhttp path 的请求被反代到 xray, 其余主动探测 / 误路径一律 drop, 不暴露伪装站.
    location / {
        return 444;
    }
}
