server {
    listen 80;
    listen [::]:80; #无 IPv6，此项可删除。

    # 泛域名匹配: 匹配 *.nodeDomain
    server_name .__nodeDomainRegex__;

    # 301 永久重定向到 https
    return 301 https://$host$request_uri;
}

# Vision fallback: 本地 8088 反向代理
server {
    listen 127.0.0.1:8088 http2;
    server_name _;

    # 默认回落: 伪装站
    location / {
        proxy_redirect off;
        proxy_pass http://__httpProxyHost__;
        proxy_set_header Host __httpProxyHost__;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
