server {
    listen 80;
    listen [::]:80; #无 IPv6，此项可删除。

    # 泛域名匹配: 匹配 *.nodeDomain
    server_name .__nodeDomainRegex__;

    # 301 永久重定向到 https
    return 301 https://$host$request_uri;
}

server {
    listen __nginxPort__ ssl;
    listen [::]:__nginxPort__ ssl;
    http2 on;

    # 泛域名匹配: 匹配 *.nodeDomain
    server_name .__nodeDomainRegex__;

    # SSL 证书 (泛域名证书)
    ssl_certificate     /etc/ssl/__nodeDomain__.pem;
    ssl_certificate_key /etc/ssl/__nodeDomain__.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # XHTTP 分流 - 无 IP 限制, 用户直连
    # xhttp-verify 模式: 同时校验 path 与自定义请求头 Xhttp-Verify.
    # Xhttp-Verify 必须等于节点绑定的随机 UUID v4 (__xhttpVerify__),
    # 不匹配 (主动探测 / 低版本客户端) 则内部重写到伪装站 (AriaNg),
    # 提前一层过滤, 避免请求直达 xray inbound.
    # (使用自定义 header, 避免被客户端自动改写 User-Agent.)
    # nginx 将请求头 Xhttp-Verify 映射为变量 $http_xhttp_verify (连字符转下划线并小写, 无需 underscores_in_headers on).
    location /__xhttpPath__ {
        if ($http_xhttp_verify != "__xhttpVerify__") {
            rewrite ^ / last;
        }

        proxy_redirect off;
        proxy_pass http://127.0.0.1:__xhttpPort__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 默认回落: 本地 AriaNg 静态站 (纯静态, 所有 conf 共用 /var/www/ariang)
    location / {
        root /var/www/ariang;
        index index.html;
    }
}
