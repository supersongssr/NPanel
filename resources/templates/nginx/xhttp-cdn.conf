# ============================================================
# xhttp-cdn 模式 (Cloudflare CDN 回源站点)
# ------------------------------------------------------------
# 与 xhttp.conf 结构一致: 本机仅作为 CF CDN 的源站, nginx 反代 xhttp 到 xray.
# 区别 (运维侧, 非本模板):
#   - server_name / 证书 = 独立 CDN 根域名 (由 __nodeDomain__ 注入)
#   - Cloudflare DNS 解析为灰云 (proxied=false), 记录内容 = 本机源站 IP
#   - 客户端连接 CF 优选 IP (v2_cdn_ip), 而非本机 IP / 域名
#   - SNI 必须与 DNS 解析一致 (订阅层不加用户前缀)
# CF 边缘据 SNI 路由到本源站, 本 nginx 转发 xhttp path 到 xray inbound.
# ============================================================
server {
    listen 80;
    listen [::]:80; #无 IPv6，此项可删除。

    # 泛域名匹配: 匹配 *.nodeDomain (CDN 根域名)
    server_name .__nodeDomainRegex__;

    # 301 永久重定向到 https
    return 301 https://$host$request_uri;
}

server {
    listen __nginxPort__ ssl;
    listen [::]:__nginxPort__ ssl;
    http2 on;

    # 泛域名匹配: 匹配 *.nodeDomain (CDN 根域名)
    server_name .__nodeDomainRegex__;

    # SSL 证书 (CDN 根域名泛域名证书)
    ssl_certificate     /etc/ssl/__nodeDomain__.pem;
    ssl_certificate_key /etc/ssl/__nodeDomain__.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # XHTTP 分流 - CF CDN 回源, 无 IP 限制
    location /__xhttpPath__ {
        proxy_redirect off;
        proxy_pass http://127.0.0.1:__xhttpPort__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 默认回落: 本地 AriaNg 静态站 (纯静态, 所有 conf 共用 /var/www/ariang)
    location / {
        root /var/www/ariang;
        index index.html;
    }
}
