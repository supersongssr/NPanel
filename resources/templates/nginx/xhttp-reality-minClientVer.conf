# xhttp-reality-minClientVer: 与 vision-reality.conf 结构一致 (仅 8443 伪装站).
# minClientVer (限制 xray 客户端最低版本 26.3.1) 写在 xray realitySettings,
# 是纯 xray REALITY 握手层强制 (低版本客户端握手被拒), nginx 仅作 dest/伪装站, 无需改动.
# 注意: xhttp-reality 的 xhttp 传输由 xray 在 reality 隧道内直接处理,
# nginx [不] 反代 xhttp path, 所以本 conf 不含 /{xhttp_path} location.
server {
    listen 80;
    listen [::]:80; #无 IPv6，此项可删除。

    # 泛域名匹配: 匹配 *.nodeDomain
    server_name .__nodeDomainRegex__;

    # 301 永久重定向到 https (走 xray reality 443, 透明回落到 nginx 8443)
    return 301 https://$host$request_uri;
}

server {
    # 8443: reality 偷自己的 dest + 非法探测/普通浏览器回落目标.
    # xray (443) realitySettings.dest=127.0.0.1:8443 把 TLS 握手与未认证流量都转到这里,
    # nginx 用泛域名证书应答, 让 reality 校验通过 + 对外像一个真实站点.
    listen 8443 ssl;
    listen [::]:8443 ssl; #无 IPv6，此项可删除。
    http2 on;

    # 泛域名匹配: 匹配 *.nodeDomain (reality SNI / serverNames = s{id}.nodeDomain)
    server_name .__nodeDomainRegex__;

    # SSL 证书 (泛域名证书, reality 偷此证书完成 TLS 握手)
    ssl_certificate     /etc/ssl/__nodeDomain__.pem;
    ssl_certificate_key /etc/ssl/__nodeDomain__.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 默认回落 / 伪装站: 本地 AriaNg 静态站 (纯静态, 所有 conf 共用 /var/www/ariang)
    location / {
        root /var/www/ariang;
        index index.html;
    }
}
