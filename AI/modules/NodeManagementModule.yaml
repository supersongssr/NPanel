module:
  name: NodeManagementModule
  chinese_name: 节点管理模块
  description: 管理代理节点的增删改查、负载监控、在线状态检测、流量统计

controller: AdminController
model:
  - SsNode
  - SsNodeInfo
  - SsNodeOnlineLog
  - SsNodeTrafficDaily
  - SsNodeTrafficHourly
  - SsNodeLabel
  - SsGroupNode
  - SsNodeIp
  - Country
  - SsGroup

where:
  - app/Http/Controllers/AdminController.php (nodeList, node, nodeMonitor methods)

api_endpoints:
  - GET /admin/node/list - 节点列表
  - GET /admin/node/{id} - 节点详情
  - POST /admin/node - 添加节点
  - PUT /admin/node/{id} - 更新节点
  - DELETE /admin/node/{id} - 删除节点
  - GET /admin/node/monitor/{id} - 节点监控
  - POST /admin/node/batch - 批量操作节点
  - GET /admin/node/statistics - 节点统计

input:
  node_data:
    type: object
    properties:
      name:
        type: string
        required: true
        description: 节点名称
      type:
        type: integer
        enum: [1,2,3,4]
        description: 节点类型(1-SS,2-V2,3-VLESS,4-Trojan)
      server:
        type: string
        required: true
        description: 服务器域名
      ip:
        type: string
        format: ipv4
        description: IPv4地址
      ipv6:
        type: string
        format: ipv6
        description: IPv6地址
      port:
        type: integer
        description: 端口
      method:
        type: string
        description: 加密方式
      group_id:
        type: integer
        description: 节点分组
      node_group:
        type: integer
        description: 节点分组(兼容字段)
      level:
        type: integer
        description: 可用等级
      country_code:
        type: string
        length: 2
        description: 国家代码
      status:
        type: integer
        enum: [0,1]
        description: 状态(0-维护,1-正常)
      sort:
        type: integer
        description: 排序值
      node_cost:
        type: integer
        description: 节点成本
      labels:
        type: array
        items:
          type: integer
        description: 节点标签ID列表

in:
  - 节点配置信息
  - 筛选条件（名称、分组、状态等）
  - 监控数据（负载、在线用户、流量）
  - 批量操作参数

output:
  node_list:
    type: array
    items:
      type: object
      properties:
        id: 节点ID
        name: 节点名称
        type: 节点类型
        server: 服务器地址
        country_code: 国家代码
        status: 状态
        online_users: 在线用户数
        load: 负载
        uptime: 运行时间
        transfer: 流量统计
  node_detail:
    type: object
    properties:
      id: 节点ID
      basic_info: 基本信息
      config: 配置参数
      statistics: 统计数据
      monitor_data: 监控数据
  monitor_chart:
    type: object
    properties:
      daily: 每日流量数据
      hourly: 每小时流量数据
      online_user: 在线用户数

out:
  - 节点列表（分页）
  - 节点详细信息
  - 节点监控图表数据
  - 节点统计信息
  - 操作结果状态

do:
  - 创建、更新、删除节点
  - 查询节点列表（支持筛选和分页）
  - 监控节点状态和负载
  - 统计节点流量使用情况
  - 管理节点分组和标签
  - 批量操作节点
  - 检测节点连通性
  - 更新节点在线状态

must:
  - 节点必须通过检测才能上线
  - 删除节点需清理相关数据
  - 节点配置必须完整有效
  - 监控数据需要定期更新
  - 管理员权限验证
  - 操作日志记录