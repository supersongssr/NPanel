module:
  name: UserManagementModule
  chinese_name: 用户管理模块
  description: 管理用户信息、邀请系统、流量查询、用户等级管理

controller: UserController
model:
  - User
  - UserTrafficLog
  - UserTrafficDaily
  - UserTrafficHourly
  - Invite
  - ReferralLog
  - UserLoginLog
  - UserBanLog
  - UserBalanceLog
  - UserSubscribe
  - UserLabel

where:
  - app/Http/Controllers/UserController.php

api_endpoints:
  - GET /user/profile - 获取用户资料
  - PUT /user/profile - 更新用户资料
  - GET /user/traffic - 获取流量统计
  - GET /user/invite - 获取邀请信息
  - POST /user/change-password - 修改密码
  - GET /user/balance - 获取余额记录
  - GET /user/subscribe - 获取订阅信息
  - POST /user/reset-subscribe - 重置订阅码
  - GET /user/ban-log - 获取封禁记录

input:
  user_id:
    type: integer
    required: for admin operations
    description: 用户ID
  email:
    type: string
    format: email
    description: 邮箱地址
  username:
    type: string
    description: 用户名
  password:
    type: string
    min_length: 8
    description: 新密码
  node_group:
    type: integer
    description: 节点分组
  level:
    type: integer
    description: 用户等级
  expire_time:
    type: datetime
    description: 到期时间
  transfer_enable:
    type: integer
    description: 流量额度(bytes)

in:
  - 用户查询条件（ID、用户名、邮箱等）
  - 用户信息更新数据
  - 流量统计查询参数
  - 邀请码生成请求

output:
  user:
    type: object
    properties:
      id: 用户ID
      username: 用户名
      email: 邮箱
      level: 用户等级
      expire_time: 到期时间
      transfer_enable: 流量额度
      u: 上传流量
      d: 下载流量
      last_checkin: 最后签到时间
      node_group: 节点分组
  traffic:
    type: object
    properties:
      total: 总流量
      upload: 上传流量
      download: 下载流量
      unused: 剩余流量
      usage: 使用百分比
  invite:
    type: object
    properties:
      code: 邀请码
      count: 邀请人数
      commission: 邀请收益
  balance_log:
    type: array
    items:
      type: object
      properties:
        amount: 金额
        description: 描述
        created_at: 时间

out:
  - 用户详细信息
  - 流量使用统计数据
  - 邀请系统数据
  - 余额变动记录
  - 登录历史记录
  - 订阅链接和配置

do:
  - 查询和展示用户信息
  - 处理用户资料更新
  - 计算和统计用户流量
  - 管理邀请码和邀请关系
  - 记录用户操作日志
  - 处理用户等级和权限
  - 生成用户订阅链接

must:
  - 仅管理员可操作其他用户信息
  - 敏感操作需要密码验证
  - 流量统计必须实时准确
  - 用户密码修改必须验证原密码
  - 邀请关系必须追溯完整