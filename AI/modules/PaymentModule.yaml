module:
  name: PaymentModule
  chinese_name: 支付系统模块
  description: 处理多种支付方式的支付请求和回调，包括支付宝、微信、第三方支付等

controller: PaymentController
model:
  - Payback
  - Order
  - UserBalanceLog
  - UserSubscribeLog
  - Coupon

where:
  - app/Http/Controllers/PaymentController.php
  - app/Http/Controllers/Api/*PayController.php

api_endpoints:
  - POST /payment/create - 创建支付订单
  - GET /payment/status/{order_id} - 查询支付状态
  - POST /payment/cancel/{order_id} - 取消支付
  - POST /api/payment/callback/{gateway} - 支付回调
  - GET /payment/methods - 获取支付方式列表
  - POST /payment/balance/use - 使用余额支付

input:
  order_id:
    type: string
    required: true
    description: 订单ID
  amount:
    type: number
    required: true
    description: 支付金额
  gateway:
    type: string
    required: true
    enum: [alipay, wechat, stripe, paypal, yzf, f2f, trimepay]
    description: 支付网关
  return_url:
    type: string
    description: 支付返回URL
  notify_url:
    type: string
    description: 支付通知URL

in:
  - 订单信息和金额
  - 支付方式选择
  - 支付回调数据
  - 用户身份验证

output:
  payment_result:
    type: object
    properties:
      success: 是否成功
      order_id: 订单ID
      payment_url: 支付链接
      qr_code: 二维码（如需要）
      amount: 支付金额
      gateway: 支付网关
  callback_response:
    type: string
    description: 回调响应（success/fail）
  payment_status:
    type: object
    properties:
      order_id: 订单ID
      status: 支付状态
      paid_amount: 已付金额
      paid_time: 支付时间

out:
  - 支付链接或二维码
  - 支付状态信息
  - 回调处理结果
  - 交易记录

do:
  - 创建支付订单
  - 调用第三方支付接口
  - 处理支付回调
  - 验证支付签名
  - 更新订单状态
  - 扣减用户余额（余额支付）
  - 记录支付日志
  - 激活用户服务
  - 发送支付通知

must:
  - 支付金额必须验证
  - 回调签名必须验证
  - 防止重复支付
  - 订单状态变更需要记录
  - 支付失败需要处理
  - 支付成功后激活服务
  - 支持退款功能（部分网关）