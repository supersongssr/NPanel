module:
  name: ShopModule
  chinese_name: 商店系统模块
  description: 管理套餐展示、购买流程、库存管理、订单处理

controller: ShopController
model:
  - SsPlan
  - Order
  - UserSubscribeLog
  - Coupon
  - User

where:
  - app/Http/Controllers/ShopController.php

api_endpoints:
  - GET /shop/plans - 获取套餐列表
  - GET /shop/plan/{id} - 获取套餐详情
  - POST /shop/purchase - 创建购买订单
  - GET /shop/orders - 获取订单列表
  - GET /shop/order/{id} - 获取订单详情
  - POST /shop/coupon/validate - 验证优惠券
  - GET /shop/coupons - 获取可用优惠券

input:
  plan_id:
    type: integer
    required: true
    description: 套餐ID
  cycle:
    type: string
    enum: [month, quarter, year]
    required: true
    description: 购买周期
  coupon_code:
    type: string
    description: 优惠券码
  payment_method:
    type: string
    enum: [alipay, wechat, stripe, balance]
    description: 支付方式

in:
  - 用户选择的套餐ID
  - 购买周期（月/季/年）
  - 优惠券码
  - 支付方式选择

output:
  plan_list:
    type: array
    items:
      type: object
      properties:
        id: 套餐ID
        name: 套餐名称
        content: 套餐内容
        month_price: 月付价格
        quarter_price: 季付价格
        year_price: 年付价格
        transfer_enable: 包含流量
        stock: 库存
        is_sale: 是否上架
        level: 需要等级
  order:
    type: object
    properties:
      id: 订单ID
      plan_id: 套餐ID
      user_id: 用户ID
      amount: 支付金额
      cycle: 购买周期
      status: 订单状态
      created_at: 创建时间
  coupon_info:
    type: object
    properties:
      code: 优惠券码
      discount: 折扣金额
      type: 优惠类型

out:
  - 套餐列表和详情
  - 购买订单信息
  - 优惠券验证结果
  - 支付链接或状态

do:
  - 展示可用套餐列表
  - 计算套餐价格（含折扣）
  - 验证用户购买资格
  - 检查套餐库存
  - 创建购买订单
  - 验证和使用优惠券
  - 处理套餐库存扣减
  - 记录购买日志

must:
  - 套餐库存不能为负数
  - 价格计算必须准确
  - 用户等级必须满足套餐要求
  - 优惠券只能使用一次
  - 购买前检查用户是否有未完成订单
  - 套餐续费时间计算准确