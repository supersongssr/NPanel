when: 2026-01-03T12:12:00+08:00
where: app/Http/Controllers/SubscribeController.php
why: 第三方订阅转换服务存在 HTTP 请求耗时、IO 等待和 CPU 空转的问题，直接影响用户体验。通过直接在本地生成 sing-box 和 Clash 订阅配置，可以显著提升订阅响应速度，减少对外部服务的依赖，并提高系统稳定性。
how:
  1. 在 getConvertedSubscribe 方法中添加了对 sing-box 和 clash 格式的特殊处理
  2. 新增 generateDirectSubscribe 方法作为统一入口，根据格式类型调用相应的生成器
  3. 新增 generateSingboxConfig 方法，生成符合 sing-box 1.8+ 规范的 JSON 配置
  4. 新增 generateClashConfig 方法，生成符合 Clash Meta/Mihomo 规范的 YAML 配置
  5. 新增 toYaml、arrayToYaml、isAssociativeArray、yamlValue 等辅助方法用于 YAML 生成
  6. 支持的节点类型包括：VMess、VLESS、Trojan
  7. 支持的传输协议包括：WebSocket (ws)、HTTP/2 (h2)、gRPC
  8. 支持的 TLS 配置包括：TLS、XTLS，以及 SNI、ALPN 等参数
  9. 自动处理流量倍率标签（traffic_rate != 1 时显示 _x2 等）
  10. 生成的配置包含完整的路由规则、DNS 配置和代理组
must:
  - 必须保持向后兼容，不影响现有的第三方转换方式（surfboard 等格式仍使用原方法）
  - 必须生成有效的 JSON 和 YAML 格式，确保客户端能够正确解析
  - 必须支持所有已存在的节点配置参数
  - 必须正确处理节点 UUID（优先使用 node_uuid，否则使用用户的 vmess_id）
  - 必须支持多种传输协议和 TLS 配置
  - 必须包含合理的路由规则和代理组配置
  - sing-box 配置必须包含必要的 outbounds（selector、direct、block、dns）
  - Clash 配置必须包含必要的 proxy-groups（Proxy、auto）
  - JSON 输出必须使用 JSON_PRETTY_PRINT 和 JSON_UNESCAPED_UNICODE
  - YAML 输出必须正确处理缩进和特殊字符
