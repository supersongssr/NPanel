when: 2025-12-25T21:22:00
where: app/Http/Controllers/Api/PingController.php
why: 在APP_DEBUG=true模式下，API返回值带有request请求信息，导致API无法正常解析JSON。POST数据被直接输出到响应体前面，使得返回值变成"参数+json"格式，影响API测试。
how: 在PingController构造函数中添加输出缓冲区清理代码，在控制器初始化时清除所有可能存在的输出缓冲，避免调试信息或其他输出污染API响应。采用在Controller内部解决而非全局中间件的方案，影响范围更小、更精准。
must:
- 最小化修改：只修改PingController.php，在构造函数中添加输出缓冲清理
- 不影响其他控制器和路由
- 不影响Web路由的debug功能
- 修复后API能正常返回纯JSON
- 测试确认：ssn_sub和ping端点都返回纯JSON响应，无POST数据前缀
