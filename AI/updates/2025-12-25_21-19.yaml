when: 2025-12-25T21:19:00
where: app/Http/Kernel.php
why: 在APP_DEBUG=true模式下，API返回值带有request请求信息，导致API无法正常解析JSON。POST数据被直接输出到响应体前面，使得返回值变成"参数+json"格式，影响API测试。
how: 将已有的DisableDebugForApi中间件注册到全局中间件堆栈中，该中间件会：
1. 检测API请求(api/*)
2. 在请求处理前禁用debug模式(app.debug=false)
3. 清除所有输出缓冲区，避免任何调试输出污染响应
4. 在请求处理后再次清除输出缓冲区
must:
- 最小化修改：只修改Kernel.php文件，复用现有的DisableDebugForApi中间件
- 在debug模式下可以输出日志，但不能影响JSON API的纯JSON输出
- 只修改API模块，不影响web路由的debug功能
- 修复后在debug模式下API能正常返回纯JSON
- 测试确认：curl测试显示API现在返回纯JSON响应，无POST数据前缀
