when: 2026-01-03T17:30:00+08:00
where: Laravel configuration cache (bootstrap/cache/config.php)
why: 容器内 php7-npanel 无法通过容器名 'redis' 连接到 Redis 服务,报错 Connection refused [tcp://127.0.0.1:6379]
how:
  - 诊断过程:
    1. 确认 .env 中 REDIS_HOST=redis 配置正确
    2. 确认 redis 和 php7-npanel 容器都在 main 网络下
    3. 测试 DNS 解析: php 能正确解析 'redis' 为 10.89.1.4
    4. 测试 Laravel 连接发现仍然连接到 127.0.0.1:6379
    5. 发现 bootstrap/cache/config.php 中缓存了旧的配置

  - 解决方案:
    执行 `php artisan config:clear` 清除 Laravel 配置缓存

    验证结果:
    ✓ Laravel Redis connection: SUCCESS
    ✓ Redis Host: redis

must:
  - 以后修改 .env 配置后,必须运行 `php artisan config:clear` 清除配置缓存
  - 在容器环境开发时,配置缓存可能导致环境变量不生效
  - 建议在开发环境禁用配置缓存,或定期清理

environment:
  container_runtime: podman
  php_container: php7-npanel
  redis_container: redis
  network: main
  laravel_version: 5.x (使用 Predis 客户端)
