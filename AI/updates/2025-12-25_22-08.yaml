when: 2025-12-25T22:08:20+08:00
where: config/app.php
why: 很多针对 Laravel 的 RCE 漏洞（如 CVE-2021-3129 Ignition 漏洞）极度依赖 APP_DEBUG=true，通过报错时提供的交互式调试界面进行攻击。当前环境 APP_DEBUG=true 存在严重安全风险。
how: 修改 config/app.php 中的 debug 配置，增加 IP 地址限制。只允许 127.0.0.1（本地回环）访问时显示调试信息，外部请求即使 APP_DEBUG=true 也无法看到调试界面。这样既保留了日志记录功能，又防止了外部攻击者利用调试界面。
must:
- debug 模式仅对 127.0.0.1 可见
- 外部请求无法看到任何调试信息（包括 Ignition 交互式界面）
- 不影响应用程序的其他功能
- 防止基于调试信息的自动化扫描和攻击
- 配置添加详细的安全注释，说明修复原因
