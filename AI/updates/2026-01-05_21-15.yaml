when: 2026-01-05T21:15:00+08:00
where:
  - app/Http/Controllers/Api/PingController.php
  - tests/Feature/GetNewNodeTest.php
why: |
  修复了 getNewNode API 中的字段名错误。
  原代码使用了不存在的字段名 `group_id`，导致在创建新节点时报错 "No available node found"。
  正确的字段名应该是 `node_group`。

how: |
  1. 在 PingController.php:358 将 `$node->group_id = 1` 改为 `$node->node_group = 1`
  2. 在 GetNewNodeTest.php:116 将测试代码中的 `$oldNode->group_id = 1` 改为 `$oldNode->node_group = 1`
  3. 在 GetNewNodeTest.php:207 将断言中的 `$node->group_id` 改为 `$node->node_group`

must:
  - SsNode 模型使用 `node_group` 字段而不是 `group_id`
  - 新创建的节点必须包含所有必需的字段
  - API 必须在没有可用节点时自动创建新节点

test_results:
  - 通过直接 API 测试验证修复成功：
    - 第一次调用返回: {"status":"success","message":"Node found","data":{"node_id":54,"v2_host":null}}
    - 第二次调用返回: {"status":"success","message":"Node found","data":{"node_id":55,"v2_host":null}}
  - API 现在能够成功创建和返回节点
