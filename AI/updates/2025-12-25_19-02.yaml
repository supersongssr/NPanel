when: 2025-12-25T19:02:47
where:
  - app/Http/Middleware/DisableDebugForApi.php (新建)
  - app/Http/Kernel.php (修改)
why: 在 APP_DEBUG=true 模式下，API 返回值带有 request 请求信息，导致 API 无法做测试
how:
  - 创建 DisableDebugForApi 中间件，在处理 API 请求时临时禁用 debug 模式
  - 在 Kernel.php 的 api 中间件组中注册该中间件
  - 中间件通过判断请求路径是否为 'api/*' 来决定是否禁用 debug
must:
  - 最小化修改，只在 debug 模式下不影响 API 的 JSON 输出
  - 只修改 API 模块相关代码
  - 在 debug 模式下发送请求能正常返回 JSON 值
  - API 响应保持纯 JSON 格式，不包含调试信息
